asyncapi: 3.0.0
info:
  title: Arba Scoring events
  version: 1.0.0
defaultContentType: application/json
channels:
  decisionMade:
    address: arba.scoring.v1.decision.made
    messages:
      decisionMade: {$ref: '#/components/messages/DecisionMade'}
  ruleSetPublished:
    address: arba.scoring.v1.ruleset.published
    messages:
      ruleSetPublished: {$ref: '#/components/messages/RuleSetPublished'}
operations:
  publishDecisionMade:
    action: send
    channel: {$ref: '#/channels/decisionMade'}
  publishRuleSetPublished:
    action: send
    channel: {$ref: '#/channels/ruleSetPublished'}
components:
  messages:
    DecisionMade:
      headers:
        $ref: '#/components/schemas/Headers'
      payload: {$ref: 'schemas.yaml#/components/schemas/DecisionMade'}
    RuleSetPublished:
      headers:
        $ref: '#/components/schemas/Headers'
      payload: {$ref: 'schemas.yaml#/components/schemas/RuleSetPublished'}
  schemas:
    Headers:
      type: object
      properties:
        Arba-Key: {type: string, description: Ключ дедупликации и порядка.}
        Arba-Created-At: {type: string, format: date-time}
