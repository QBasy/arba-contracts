asyncapi: 3.0.0
info:
  title: Arba Origination events
  version: 1.0.0
defaultContentType: application/json
channels:
  applicationSubmitted:
    address: arba.origination.v1.application.submitted
    messages:
      applicationSubmitted: {$ref: '#/components/messages/ApplicationSubmitted'}
  applicationStatusChanged:
    address: arba.origination.v1.application.status_changed
    messages:
      applicationStatusChanged: {$ref: '#/components/messages/ApplicationStatusChanged'}
  applicationOfferAccepted:
    address: arba.origination.v1.application.offer_accepted
    messages:
      applicationOfferAccepted: {$ref: '#/components/messages/ApplicationOfferAccepted'}
operations:
  publishApplicationSubmitted:
    action: send
    channel: {$ref: '#/channels/applicationSubmitted'}
  publishApplicationStatusChanged:
    action: send
    channel: {$ref: '#/channels/applicationStatusChanged'}
  publishApplicationOfferAccepted:
    action: send
    channel: {$ref: '#/channels/applicationOfferAccepted'}
components:
  messages:
    ApplicationSubmitted:
      headers:
        $ref: '#/components/schemas/Headers'
      payload: {$ref: 'schemas.yaml#/components/schemas/ApplicationSubmitted'}
    ApplicationStatusChanged:
      headers:
        $ref: '#/components/schemas/Headers'
      payload: {$ref: 'schemas.yaml#/components/schemas/ApplicationStatusChanged'}
    ApplicationOfferAccepted:
      headers:
        $ref: '#/components/schemas/Headers'
      payload: {$ref: 'schemas.yaml#/components/schemas/ApplicationOfferAccepted'}
  schemas:
    Headers:
      type: object
      properties:
        Arba-Key: {type: string, description: Ключ дедупликации и порядка.}
        Arba-Created-At: {type: string, format: date-time}
