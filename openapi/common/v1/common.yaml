openapi: 3.1.0
info:
  title: Arba common schemas
  version: 1.0.0
  description: Общие схемы, параметры и ответы.
paths: {}
components:
  schemas:
    Currency:
      type: string
      enum: [KZT]
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          pattern: '^-?[0-9]+$'
          description: Сумма в тиынах.
          examples: ["1500000"]
        currency:
          $ref: '#/components/schemas/Currency'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
        code: {type: string}
    Problem:
      type: object
      description: RFC 9457.
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: {type: string}
        has_more: {type: boolean}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    Problem:
      description: Ошибка в формате Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
