openapi: 3.1.0
info:
  title: Arba common schemas
  version: 1.0.0
  description: Общие схемы, параметры и ответы.
paths: {}
components:
  schemas:
    Currency:
      type: string
      description: Код валюты ISO 4217.
      enum: [KZT]
    Money:
      type: object
      description: Денежная сумма в минимальных единицах (тиын).
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: string
          pattern: '^-?[0-9]+$'
          description: Сумма в тиынах.
          examples: ["1500000"]
        currency:
          $ref: '#/components/schemas/Currency'
    FieldError:
      type: object
      description: Ошибка отдельного поля или недостающего элемента.
      required: [field, message]
      properties:
        field: {type: string, description: Путь к полю или элементу, например consent:credit_bureau.}
        message: {type: string, description: Описание ошибки.}
        code: {type: string, description: Машинный код ошибки.}
    Problem:
      type: object
      description: RFC 9457.
      required: [type, title, status]
      properties:
        type: {type: string, description: URI типа проблемы., examples: ['about:blank']}
        title: {type: string, description: Краткое название.}
        status: {type: integer, description: HTTP-статус.}
        detail: {type: string, description: Подробности; для 5xx пусто.}
        instance: {type: string, description: Путь запроса.}
        code: {type: string, description: Стабильный машинный код для клиентской логики.}
        errors:
          type: array
          description: Ошибки по полям.
          items:
            $ref: '#/components/schemas/FieldError'
    PageInfo:
      type: object
      description: Состояние курсорной пагинации.
      required: [has_more]
      properties:
        next_cursor: {type: string, description: Курсор следующей страницы.}
        has_more: {type: boolean, description: Есть ли следующая страница.}
    AuditActor:
      type: object
      description: Кто совершил действие.
      required: [kind, subject]
      properties:
        kind: {type: string, description: Вид исполнителя - роль из токена (client, manager, underwriter) или system., examples: [manager]}
        subject: {type: string, description: Идентификатор исполнителя (sub токена).}
    AuditEntry:
      type: object
      description: Запись журнала аудита. Записи только добавляются и не изменяются.
      required: [id, at, actor, action, entity_type, entity_id]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time, description: Время действия.}
        actor:
          $ref: '#/components/schemas/AuditActor'
        action: {type: string, description: Действие, например application.submit., examples: [application.submit]}
        entity_type: {type: string, examples: [application]}
        entity_id: {type: string}
        before:
          type: object
          additionalProperties: true
          description: Состояние до действия; нет у создания.
        after:
          type: object
          additionalProperties: true
          description: Состояние после действия. Персональные данные не хранятся.
        request_id: {type: string, description: Идентификатор запроса, в рамках которого сделано действие.}
    AuditPage:
      type: object
      description: Страница журнала аудита, новые записи первыми.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
  headers:
    RequestID:
      description: Идентификатор запроса; принимается от клиента или генерируется.
      schema: {type: string}
    ETag:
      description: Версия ресурса в кавычках; передаётся обратно в If-Match.
      schema: {type: string, examples: ['"3"']}
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Ожидаемая версия ресурса (значение ETag). При несовпадении — 412.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ повтора; тот же ключ с тем же телом вернёт сохранённый ответ.
      schema: {type: string, minLength: 8, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      description: Курсор из page.next_cursor предыдущего ответа.
      schema: {type: string}
    AuditEntityType:
      name: entity_type
      in: query
      description: Фильтр по типу сущности.
      schema: {type: string}
    AuditEntityID:
      name: entity_id
      in: query
      description: Фильтр по идентификатору сущности; вместе с entity_type даёт историю одной сущности.
      schema: {type: string}
    AuditAction:
      name: action
      in: query
      description: Фильтр по действию.
      schema: {type: string}
    AuditFrom:
      name: from
      in: query
      description: Не раньше этого времени (включительно).
      schema: {type: string, format: date-time}
    AuditTo:
      name: to
      in: query
      description: Строго раньше этого времени.
      schema: {type: string, format: date-time}
    Limit:
      name: limit
      in: query
      description: Размер страницы.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    Problem:
      description: Ошибка в формате Problem Details.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Некорректный запрос (invalid_json, idempotency_key_required, idempotency_key_invalid).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Нет или недействителен токен (unauthorized).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Недостаточно прав (forbidden).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ресурс не найден в тенанте (not_found).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт состояния (invalid_transition, not_draft, idempotency_in_progress).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Версия ресурса не совпала с If-Match (version_mismatch).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Запрос понятен, но не выполним (invalid_argument, incomplete_application, offer_expired, reason_required, idempotency_key_reused).
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestID'}
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
