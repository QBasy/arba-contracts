openapi: 3.1.0
info:
  title: Arba Origination API
  version: 1.0.0
  description: Заявки на лизинг — от черновика до принятого офера.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: audit
    description: Журнал аудита.
  - name: applications
    description: Жизненный цикл заявки.
paths:
  /v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Журнал аудита
      description: Записи журнала тенанта, новые первыми. Только чтение; записи не изменяются и не удаляются.
      x-required-roles: [auditor]
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/Cursor'
        - $ref: '../../common/v1/common.yaml#/components/parameters/Limit'
        - $ref: '../../common/v1/common.yaml#/components/parameters/AuditEntityType'
        - $ref: '../../common/v1/common.yaml#/components/parameters/AuditEntityID'
        - $ref: '../../common/v1/common.yaml#/components/parameters/AuditAction'
        - $ref: '../../common/v1/common.yaml#/components/parameters/AuditFrom'
        - $ref: '../../common/v1/common.yaml#/components/parameters/AuditTo'
      responses:
        '200':
          description: Страница журнала.
          content:
            application/json:
              schema: {$ref: '../../common/v1/common.yaml#/components/schemas/AuditPage'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Создать черновик
      description: Создаёт пустой черновик заявки для тенанта из токена.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Черновик создан.
          headers:
            ETag: {$ref: '../../common/v1/common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
    get:
      operationId: listApplications
      tags: [applications]
      summary: Список заявок
      description: Заявки тенанта, новые первыми; пагинация курсором.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/Cursor'
        - $ref: '../../common/v1/common.yaml#/components/parameters/Limit'
        - name: status
          in: query
          description: Фильтр по статусу.
          schema: {$ref: '#/components/schemas/Status'}
      responses:
        '200':
          description: Страница заявок.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPage'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    get:
      operationId: getApplication
      tags: [applications]
      summary: Получить заявку
      description: Текущее состояние заявки, включая историю переходов.
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/vehicle:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    put:
      operationId: selectVehicle
      tags: [applications]
      summary: Выбрать автомобиль
      description: Шаг 1. Доступно только в статусе draft.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SelectVehicleRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/terms:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    put:
      operationId: setTerms
      tags: [applications]
      summary: Задать условия лизинга
      description: Шаг 1. Продукт, цена автомобиля, аванс, срок и декларируемые данные заявителя для скоринга. Доступно только в статусе draft.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetTermsRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/applicant:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    put:
      operationId: attachApplicant
      tags: [applications]
      summary: Указать заявителя
      description: Шаг 2. Тип заявителя определяет обязательные согласия и документы.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttachApplicantRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/consents/{kind}:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - name: kind
        in: path
        required: true
        description: Вид.
        schema: {$ref: '#/components/schemas/ConsentKind'}
    put:
      operationId: grantConsent
      tags: [applications]
      summary: Дать согласие
      description: Шаг 3. Фиксирует версию текста согласия.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantConsentRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
    delete:
      operationId: revokeConsent
      tags: [applications]
      summary: Отозвать согласие
      description: Доступно только в статусе draft.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/documents/{kind}:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
      - name: kind
        in: path
        required: true
        description: Вид.
        schema: {$ref: '#/components/schemas/DocumentKind'}
    put:
      operationId: attachDocument
      tags: [applications]
      summary: Приложить документ
      description: Шаг 4. Файл должен быть заранее загружен в files.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttachDocumentRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Отправить на скоринг
      description: Проверяет комплектность, переводит заявку в scoring и запускает автоматические шаги (скоринг и выпуск офера). Если смежный сервис недоступен, заявка остаётся в своём статусе, шаг повторяется через advance. При нехватке данных возвращает 422 incomplete_application со списком в errors.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: cancelApplication
      tags: [applications]
      summary: Отменить заявку
      description: Отмена клиентом или сотрудником из любого нетерминального статуса.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/manual-decision:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: resolveManualReview
      tags: [applications]
      summary: Ручное решение
      description: Решение андеррайтера по заявке в статусе manual_review.
      x-required-roles: [underwriter]
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualDecisionRequest'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/offer/accept:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: acceptOffer
      tags: [applications]
      summary: Принять офер
      description: Доступно клиенту, пока офер не истёк.
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../../common/v1/common.yaml#/components/parameters/IfMatch'
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/advance:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: advanceApplication
      tags: [applications]
      summary: Продолжить обработку
      description: Повторяет автоматический шаг, который не завершился из-за сбоя смежного сервиса (scoring → скоринг, approved → выпуск офера). Если шаг не нужен, возвращает заявку без изменений.
      x-required-roles: [system, manager, underwriter]
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
  /v1/applications/{id}/contract:
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    post:
      operationId: activateContract
      tags: [applications]
      summary: Открыть договор
      description: Для заявки в статусе offer_accepted открывает договор в servicing по снимку графика из офера и переводит заявку в contract_signed. Повтор безопасен.
      x-required-roles: [system, manager]
      parameters:
        - $ref: '../../common/v1/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '400': {$ref: '../../common/v1/common.yaml#/components/responses/BadRequest'}
        '401': {$ref: '../../common/v1/common.yaml#/components/responses/Unauthorized'}
        '403': {$ref: '../../common/v1/common.yaml#/components/responses/Forbidden'}
        '404': {$ref: '../../common/v1/common.yaml#/components/responses/NotFound'}
        '409': {$ref: '../../common/v1/common.yaml#/components/responses/Conflict'}
        '412': {$ref: '../../common/v1/common.yaml#/components/responses/PreconditionFailed'}
        '422': {$ref: '../../common/v1/common.yaml#/components/responses/Unprocessable'}
        default: {$ref: '../../common/v1/common.yaml#/components/responses/Problem'}
components:
  securitySchemes:
    bearer:
      description: JWT, выданный Keycloak; tenant_id и roles берутся из claims.
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApplicationID:
      name: id
      in: path
      required: true
      description: Идентификатор заявки.
      schema: {type: string, format: uuid}
  responses:
    Application:
      description: Актуальное состояние заявки.
      headers:
        ETag: {$ref: '../../common/v1/common.yaml#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Application'}
  schemas:
    Status:
      description: Статус заявки.
      type: string
      enum: [draft, scoring, manual_review, approved, rejected, offer_issued, offer_accepted, contract_signed, cancelled, expired]
      x-enum-varnames: [StatusDraft, StatusScoring, StatusManualReview, StatusApproved, StatusRejected, StatusOfferIssued, StatusOfferAccepted, StatusContractSigned, StatusCancelled, StatusExpired]
    ApplicantKind:
      description: Тип заявителя.
      type: string
      enum: [individual, taxi_driver]
      x-enum-varnames: [ApplicantKindIndividual, ApplicantKindTaxiDriver]
    ConsentKind:
      description: Вид согласия.
      type: string
      enum: [personal_data, credit_bureau, aggregator_data, telematics]
      x-enum-varnames: [ConsentKindPersonalData, ConsentKindCreditBureau, ConsentKindAggregatorData, ConsentKindTelematics]
    DocumentKind:
      description: Вид документа.
      type: string
      enum: [identity, driver_license, income]
      x-enum-varnames: [DocumentKindIdentity, DocumentKindDriverLicense, DocumentKindIncome]
    Outcome:
      description: Решение по заявке.
      type: string
      enum: [approve, reject]
      x-enum-varnames: [OutcomeApprove, OutcomeReject]
    ActorKind:
      description: Кто совершил действие.
      type: string
      enum: [client, underwriter, system]
      x-enum-varnames: [ActorKindClient, ActorKindUnderwriter, ActorKindSystem]
    Consent:
      description: Данное согласие.
      type: object
      required: [kind, text_version, granted_at]
      properties:
        kind: {$ref: '#/components/schemas/ConsentKind'}
        text_version: {type: string}
        granted_at: {type: string, format: date-time}
    Document:
      description: Приложенный документ.
      type: object
      required: [kind, file_id, added_at]
      properties:
        kind: {$ref: '#/components/schemas/DocumentKind'}
        file_id: {type: string, format: uuid}
        added_at: {type: string, format: date-time}
    Offer:
      description: Выпущенный офер.
      type: object
      required: [id, expires_at]
      properties:
        id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    Transition:
      description: Запись истории переходов статуса.
      type: object
      required: [from, to, actor, at]
      properties:
        from: {$ref: '#/components/schemas/Status'}
        to: {$ref: '#/components/schemas/Status'}
        actor: {$ref: '#/components/schemas/ActorKind'}
        reason: {type: string}
        at: {type: string, format: date-time}
    Application:
      description: Заявка на лизинг.
      type: object
      required: [id, status, version, consents, documents, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/Status'}
        version: {type: integer, format: int64}
        applicant_id: {type: string, format: uuid}
        applicant_kind: {$ref: '#/components/schemas/ApplicantKind'}
        vehicle_id: {type: string, format: uuid}
        decision_id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        offer: {$ref: '#/components/schemas/Offer'}
        terms: {$ref: '#/components/schemas/LeaseTerms'}
        declared: {$ref: '#/components/schemas/DeclaredProfile'}
        consents:
          type: array
          items: {$ref: '#/components/schemas/Consent'}
        documents:
          type: array
          items: {$ref: '#/components/schemas/Document'}
        missing:
          type: array
          description: Чего не хватает для отправки на скоринг.
          items: {type: string}
        history:
          type: array
          items: {$ref: '#/components/schemas/Transition'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ApplicationPage:
      description: Страница заявок.
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Application'}
        page:
          $ref: '../../common/v1/common.yaml#/components/schemas/PageInfo'
    LeaseTerms:
      description: Условия лизинга, на которых считаются офер и скоринг.
      type: object
      required: [product_id, vehicle_price, down_payment, term_months]
      properties:
        product_id: {type: string, format: uuid}
        vehicle_price: {$ref: '../../common/v1/common.yaml#/components/schemas/Money'}
        down_payment: {$ref: '../../common/v1/common.yaml#/components/schemas/Money'}
        term_months: {type: integer, minimum: 1}
    DeclaredProfile:
      description: Данные заявителя, которые он указал сам; до подключения источников (бюро, агрегатор) используются в скоринге как есть.
      type: object
      required: [age_years, monthly_income, monthly_obligations]
      properties:
        age_years: {type: integer, minimum: 0, maximum: 150}
        monthly_income: {$ref: '../../common/v1/common.yaml#/components/schemas/Money'}
        monthly_obligations: {$ref: '../../common/v1/common.yaml#/components/schemas/Money'}
    SetTermsRequest:
      description: Условия и декларируемые данные.
      type: object
      required: [terms, declared]
      properties:
        terms: {$ref: '#/components/schemas/LeaseTerms'}
        declared: {$ref: '#/components/schemas/DeclaredProfile'}
    SelectVehicleRequest:
      description: Выбор автомобиля.
      type: object
      required: [vehicle_id]
      properties:
        vehicle_id: {type: string, format: uuid}
    AttachApplicantRequest:
      description: Привязка заявителя.
      type: object
      required: [applicant_id, kind]
      properties:
        applicant_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ApplicantKind'}
    GrantConsentRequest:
      description: Данные согласия.
      type: object
      required: [text_version]
      properties:
        text_version: {type: string, minLength: 1}
    AttachDocumentRequest:
      description: Ссылка на загруженный файл.
      type: object
      required: [file_id]
      properties:
        file_id: {type: string, format: uuid}
    CancelRequest:
      description: Причина отмены.
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    ManualDecisionRequest:
      description: Решение андеррайтера.
      type: object
      required: [decision_id, outcome, reason]
      properties:
        decision_id: {type: string, format: uuid}
        outcome: {$ref: '#/components/schemas/Outcome'}
        reason: {type: string, minLength: 1, maxLength: 500}

